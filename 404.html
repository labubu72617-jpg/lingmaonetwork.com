<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>页面不存在 - 灵猫 Civet Cat</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;

    .nf-card {
      width: 100%;
      max-width: 480px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    .nf-card img { width: 72px; height: 72px; border-radius: 16px; }
    .nf-code { font-size: 3rem; font-weight: 800; letter-spacing: -1px; margin: 16px 0 4px; }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    p { color: #64748b; line-height: 1.7; margin: 0 0 28px; }
    .nf-actions { display: flex; flex-direction: column; gap: 12px; }
    .nf-actions a {
      display: block;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
    }
    .nf-primary { background: #0f172a; color: #ffffff; }
    .nf-secondary { background: #f1f5f9; color: #0f172a; }

</head>
<body>
  <main class="nf-card">
    <img src="/assets/images/logo.png" alt="灵猫 Civet Cat" width="72" height="72">

      <a class="nf-primary" href="/">返回灵猫首页</a>
      <a class="nf-secondary" href="/pricing.html">查看订阅套餐</a>
